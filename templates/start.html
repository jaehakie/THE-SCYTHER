<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Scyther 시작 화면</title>
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/start-screen/style.css?v=story-audio-1">

</head>
<body>
<main class="screen" id="screen">
  <button type="button" class="sound-toggle" data-sound-toggle data-sound-icon aria-label="소리 켜기" aria-pressed="false" title="소리 켜기"></button>
  <div class="emblem" role="img" aria-label="수확령 로고"></div>
  <header class="title">
    <span class="the">THE</span>
    <h1 class="main" style="margin:0">Scyther<i>.</i></h1>
  </header>
  <div class="bottom">
    <div class="vow"><p class="slogan" aria-label="Serviré a la humanidad.">Servir<span class="e">e</span> a la humanidad.</p><p class="ko">인류를 위해 봉사하리라</p></div><form action="/play" id="start-form"><button class="start" id="start" type="submit">START</button></form>
  </div>
  <div class="curtain" id="curtain" aria-live="polite" aria-hidden="true" inert>
    <div><p>수확령에 접속하는 중입니다…</p><small>Serviré a la humanidad.</small><button type="button" id="back">처음 화면으로</button></div>
  </div>
</main>
<script src="/assets/start-screen/main.js?v=story-audio-1" defer></script>
